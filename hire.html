<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Me - Bhim Bahadur Magar</title>
    <!-- Import Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        
        /* Slideshow Animations */
        .slideshow-container {
            position: relative;
            max-width: 100%;
            margin: auto;
            overflow: hidden;
        }
        .slide {
            display: none;
            text-align: center;
        }
        .fade {
            animation: fade 1.5s ease-in-out;
        }
        @keyframes fade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Hover Effects */
        .hover-effect:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.3);
        }

        /* Timer Glow Effect */
        #timer {
            text-shadow: 0 0 10px #00bcd4, 0 0 20px #00bcd4;
        }
    </style>
</head>
<body class="bg-gradient-to-r from-gray-900 to-gray-800 text-gray-200 font-sans">
    <div class="max-w-4xl mx-auto my-10 p-8 bg-gray-900 shadow-2xl rounded-lg">
        <!-- Header Section -->
        <header class="text-center mb-10">
            <h1 class="text-5xl font-extrabold text-white">Hire Me</h1>
            <p class="text-lg text-gray-400 mt-4">You can hire me after this much time!</p>
        </header>

        <!-- Countdown Timer -->
        <section class="text-center mb-10">
            <h2 class="text-3xl font-semibold text-white mb-4">Countdown Timer</h2>
            <p id="timer" class="text-2xl font-bold text-cyan-400"></p>
        </section>

        <!-- Slideshow Section -->
        <section class="slideshow-container mb-10">
            <div class="slide fade hover-effect p-6 bg-gray-800 rounded-lg shadow-lg">
                <p class="text-2xl font-semibold text-gray-300">"Still learning, but ready to grow!"</p>
            </div>
            <div class="slide fade hover-effect p-6 bg-gray-800 rounded-lg shadow-lg">
                <p class="text-2xl font-semibold text-gray-300">"You can hire me after 2 months!"</p>
            </div>
            <div class="slide fade hover-effect p-6 bg-gray-800 rounded-lg shadow-lg">
                <p class="text-2xl font-semibold text-gray-300">"Excited to collaborate and create amazing projects!"</p>
            </div>
        </section>

        <!-- Contact Form Section -->
        <section>
            <h2 class="text-3xl font-semibold text-white mb-4">Contact Me</h2>
            <form action="https://formspree.io/f/xovdloqv" method="POST" class="space-y-6">
                <div>
                    <label for="name" class="block text-lg font-medium text-gray-300">Your Name</label>
                    <input type="text" id="name" name="name" required class="w-full mt-2 p-3 border border-gray-700 rounded-lg bg-gray-800 text-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>
                <div>
                    <label for="email" class="block text-lg font-medium text-gray-300">Your Email</label>
                    <input type="email" id="email" name="email" required class="w-full mt-2 p-3 border border-gray-700 rounded-lg bg-gray-800 text-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>
                <div>
                    <label for="message" class="block text-lg font-medium text-gray-300">Your Message</label>
                    <textarea id="message" name="message" rows="5" required class="w-full mt-2 p-3 border border-gray-700 rounded-lg bg-gray-800 text-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"></textarea>
                </div>
                <button type="submit" class="w-full py-3 bg-cyan-500 text-white text-lg font-semibold rounded-lg shadow-md hover:bg-cyan-600 hover:shadow-lg transition duration-300">
                    Send Message
                </button>
            </form>
        </section>
    </div>

    <script>
        // Countdown Timer
        const timerElement = document.getElementById('timer');
        const twoMonthsInMs = 60 * 24 * 60 * 60 * 1000; // 2 months in milliseconds
        const endTime = localStorage.getItem('hireMeEndTime') || (Date.now() + twoMonthsInMs);

        localStorage.setItem('hireMeEndTime', endTime);

        function updateTimer() {
            const now = Date.now();
            const timeLeft = endTime - now;

            if (timeLeft <= 0) {
                timerElement.textContent = "You can hire me now!";
                clearInterval(timerInterval);
                return;
            }

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            timerElement.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        const timerInterval = setInterval(updateTimer, 1000);
        updateTimer();

        // Slideshow
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slide');

        function showSlides() {
            slides.forEach((slide, index) => {
                slide.style.display = index === slideIndex ? 'block' : 'none';
            });

            slideIndex = (slideIndex + 1) % slides.length;
        }

        setInterval(showSlides, 3000);
        showSlides();
    </script>
</body>
</html>
